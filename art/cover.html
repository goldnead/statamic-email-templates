<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: radial-gradient(1200px 700px at 78% 22%, #881337 0%, #500724 55%, #1B0E14 100%);
    color: #fff; overflow: hidden; position: relative;
  }
  .wrap { display: flex; height: 100%; align-items: center; padding: 0 92px; gap: 64px; }
  .copy { max-width: 660px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 22px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: #FBCFE8; margin-bottom: 26px;
  }
  .eyebrow .dot { width: 12px; height: 12px; border-radius: 50%; background: #F472B6; box-shadow: 0 0 18px #F472B6; }
  h1 { font-size: 70px; line-height: 1.02; font-weight: 800; letter-spacing: -.02em; }
  h1 .accent { background: linear-gradient(90deg,#FDA4AF,#F9A8D4); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.sub { margin-top: 28px; font-size: 30px; line-height: 1.35; color: #CBD5E1; font-weight: 400; }
  .badges { margin-top: 40px; display: flex; gap: 14px; }
  .badge { font-size: 22px; font-weight: 600; padding: 12px 22px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); color: #FCE7F3; white-space: nowrap; }
  .art { flex: 1; display: flex; align-items: center; justify-content: center; }
  .glyph { width: 360px; height: 360px; filter: drop-shadow(0 30px 60px rgba(0,0,0,.45)); }
  .corner { position: absolute; right: -120px; bottom: -160px; width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(236,72,153,.30), transparent 60%); }
</style>
</head>
<body>
  <div class="corner"></div>
  <div class="wrap">
    <div class="copy">
      <span class="eyebrow"><span class="dot"></span>Statamic Addon</span>
      <h1>Statamic<br><span class="accent">Email Templates</span></h1>
      <p class="sub">Emails as ordinary entries in a managed collection &mdash; authored in Bard, edited in the native publish form, with Live Preview.</p>
      <div class="badges">
        <span class="badge">Collection</span>
        <span class="badge">Bard</span>
        <span class="badge">Live Preview</span>
        <span class="badge">No new CP</span>
      </div>
    </div>
    <div class="art">
      <svg class="glyph" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop stop-color="#F43F5E"/><stop offset="1" stop-color="#EC4899"/>
          </linearGradient>
          <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4C0519" flood-opacity="0.32"/>
          </filter>
        </defs>
        <rect width="512" height="512" rx="112" fill="url(#bg)"/>
        <!-- template sheet -->
        <g filter="url(#sh)">
          <rect x="108" y="100" width="296" height="312" rx="36" fill="#FFFFFF"/>
        </g>
        <!-- hero block -->
        <rect x="146" y="140" width="220" height="62" rx="16" fill="url(#bg)"/>
        <!-- copy lines -->
        <g fill="url(#bg)" opacity="0.45">
          <rect x="146" y="228" width="220" height="16" rx="8"/>
          <rect x="146" y="260" width="184" height="16" rx="8"/>
          <rect x="146" y="292" width="202" height="16" rx="8"/>
        </g>
        <!-- call to action -->
        <rect x="146" y="332" width="122" height="42" rx="21" fill="url(#bg)"/>
      </svg>
    </div>
  </div>
</body>
</html>
