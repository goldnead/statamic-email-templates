<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F43F5E"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4C0519" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- template sheet -->
  <g filter="url(#sh)">
    <rect x="108" y="100" width="296" height="312" rx="36" fill="#FFFFFF"/>
  </g>
  <!-- hero block -->
  <rect x="146" y="140" width="220" height="62" rx="16" fill="url(#bg)"/>
  <!-- copy lines -->
  <g fill="url(#bg)" opacity="0.45">
    <rect x="146" y="228" width="220" height="16" rx="8"/>
    <rect x="146" y="260" width="184" height="16" rx="8"/>
    <rect x="146" y="292" width="202" height="16" rx="8"/>
  </g>
  <!-- call to action -->
  <rect x="146" y="332" width="122" height="42" rx="21" fill="url(#bg)"/>
</svg>
